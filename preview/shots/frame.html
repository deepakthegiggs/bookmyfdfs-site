<!doctype html><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;background:#888}iframe{border:0;display:block}</style>
<script>var p=new URLSearchParams(location.search);document.write('<iframe src="'+p.get('src')+'" width="'+p.get('w')+'" height="'+p.get('h')+'"></iframe>')
var f=document.querySelector('iframe');f.onload=function(){try{f.height=f.contentDocument.body.getBoundingClientRect().height}catch(e){}}</script>
